name: AI Quant Trading Report v8.5

on:
  schedule:
    # 每週一到五 UTC 09:17 執行（台灣時間 17:17 收盤後，避開 GitHub Actions 整點高峰）
    - cron: '17 9 * * 1-5'
    # 每月 1 日 UTC 10:00 跑月報
    - cron: '0 10 1 * *'
  workflow_dispatch:
    inputs:
      tp_atr:
        description: 'ATR 停利倍數'
        required: false
        default: '4.0'
      sl_atr:
        description: 'ATR 停損倍數'
        required: false
        default: '3.0'
      hold_days:
        description: '最大持倉天數'
        required: false
        default: '20'
      top_k:
        description: '每日最多進場股票數'
        required: false
        default: '7'
      days:
        description: '回測天數'
        required: false
        default: '1200'
      gap_filter:
        description: '跳空過濾 ATR 倍數'
        required: false
        default: '1.5'

# 防止多個 run 同時 push 造成 race condition
concurrency:
  group: ai-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # This repo contains large tracked market data. A full-history fetch can
          # exhaust the hosted runner before the job even starts.
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Quant Pipeline v8.5
        if: github.event.schedule != '0 10 1 * *'
        run: |
          python ai_report.py \
            --regime-filter \
            --regime-graduated \
            --breadth-regime \
            --regime-floor 0.10 \
            --tp-atr ${{ github.event.inputs.tp_atr || '4.0' }} \
            --sl-atr ${{ github.event.inputs.sl_atr || '3.0' }} \
            --hold-days ${{ github.event.inputs.hold_days || '20' }} \
            --top-k ${{ github.event.inputs.top_k || '7' }} \
            --gap-filter ${{ github.event.inputs.gap_filter || '1.5' }} \
            --days ${{ github.event.inputs.days || '1200' }}

      - name: Paper Trading Tracker
        if: github.event.schedule != '0 10 1 * *'
        run: python paper_tracker.py

      - name: Monthly Paper Trading Report
        if: github.event.schedule == '0 10 1 * *'
        run: python paper_trade.py monthly

      - name: Cleanup old artifacts (keep last 180 days)
        run: |
          if [ -d "artifacts" ]; then
            find artifacts/ -type f -mtime +180 -delete 2>/dev/null || true
          fi
      - name: Commit and push
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "🤖 AI Report $(date -u +%Y-%m-%d)"
            git fetch origin ${{ github.ref_name }}
            git rebase -X theirs origin/${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Wait for GitHub Pages Deploy
        run: sleep 30 # 等 30 秒讓 Pages 更新完

      - name: Install twstock for name lookup
        if: always()
        run: pip install twstock --quiet

      - name: Discord Notify - 簡單版
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%d)
          if [ -f "stock_report.html" ]; then
            PICKS=$(python3 << 'EOF'
          import re, html as h, json, os
          import twstock

          PICKS_FILE = "artifacts/daily_picks.json"
          yesterday_streaks = {}
          if os.path.exists(PICKS_FILE):
              try:
                  with open(PICKS_FILE, "r") as f:
                      saved = json.load(f)
                  yesterday_streaks = saved.get("picks", {})
              except Exception:
                  pass

          with open('stock_report.html', 'r', encoding='utf-8') as f:
              txt = f.read()

          m = re.search(r'今日 AI 交易執行單.*?<tbody>(.*?)</tbody>', txt, re.S)
          if not m:
              print("今日無選股-找不到表格")
          else:
              rows = re.findall(r'<tr>(.*?)</tr>', m.group(1), re.S)
              out = []
              for r in rows[:7]:
                  cols = [h.unescape(re.sub('<.*?>', '', c)).strip()
                          for c in re.findall(r'<td.*?>(.*?)</td>', r, re.S)]
                  if len(cols) >= 3:
                      code = cols[0]
                      prev = yesterday_streaks.get(code, 0)
                      streak = prev + 1
                      # 從 twstock 查名稱
                      name = ""
                      try:
                          name = twstock.codes[code].name if code in twstock.codes else ""
                      except Exception:
                          pass
                      streak_str = f"({streak})" if streak >= 2 else ""
                      display = f"{code} {name}{streak_str}".strip()
                      out.append(f"{display} {cols[1]} 收{cols[2]}")
              print('\n'.join(out) if out else "今日無選股")
          EOF
          )
          else
            PICKS="今日無選股-找不到stock_report.html"
          fi
          jq -n \
            --arg content "**tw_stocker 每日選股 ${DATE}**
          \`\`\`
          ${PICKS}
          \`\`\`
          [AI 台股量化交易 v8.5 — ${DATE}](https://ghost3070634-lab.github.io/tw_stocker/stock_report.html)" \
            '{content: $content}' | \
          curl -s -H "Content-Type: application/json" -X POST -d @- ${{ secrets.DISCORD_WEBHOOK }}

      - name: Discord Notify - 進出場詳細版 v8.5
        if: always()
        run: |
          DATE=$(date -u +%Y-%m-%d)
          if [ -f "stock_report.html" ]; then
            PICKS=$(python3 << 'EOF'
          import re, html as h, json, os
          import twstock
          from datetime import datetime, timezone, timedelta

          PICKS_FILE = "artifacts/daily_picks.json"
          yesterday_streaks = {}
          if os.path.exists(PICKS_FILE):
              try:
                  with open(PICKS_FILE, "r") as f:
                      saved = json.load(f)
                  yesterday_streaks = saved.get("picks", {})
              except Exception:
                  pass

          with open('stock_report.html', 'r', encoding='utf-8') as f:
              txt = f.read()

          m = re.search(r'今日 AI 交易執行單.*?<tbody>(.*?)</tbody>', txt, re.S)
          if not m:
              print("今日無選股-解析失敗")
          else:
              rows = re.findall(r'<tr>(.*?)</tr>', m.group(1), re.S)
              out = []
              today_streaks = {}
              for r in rows[:7]:
                  cols = [h.unescape(re.sub('<.*?>', '', c)).strip()
                          for c in re.findall(r'<td.*?>(.*?)</td>', r, re.S)]
                  if len(cols) >= 5:
                      code = cols[0]
                      prev = yesterday_streaks.get(code, 0)
                      streak = prev + 1
                      today_streaks[code] = streak
                      # 從 twstock 查名稱
                      name = ""
                      try:
                          name = twstock.codes[code].name if code in twstock.codes else ""
                      except Exception:
                          pass
                      streak_str = f"({streak})" if streak >= 2 else ""
                      display = f"{code} {name}{streak_str}".strip()
                      plan = cols[4]
                      tp = re.search(r'停利[:：]\s*([\d\.]+)', plan)
                      sl = re.search(r'停損[:：]\s*([\d\.]+)', plan)
                      tp = tp.group(1) if tp else "?"
                      sl = sl.group(1) if sl else "?"
                      out.append(f"{display} | 分數:{cols[1]}")
                      out.append(f" 收盤:{cols[2]} | 停利:{tp} | 停損:{sl}\n")

              # ── 只有詳細版負責寫 JSON，簡單版只讀 ──
              os.makedirs("artifacts", exist_ok=True)
              with open(PICKS_FILE, "w") as f:
                  tz = timezone(timedelta(hours=8))
                  json.dump({
                      "date": datetime.now(tz).strftime("%Y-%m-%d"),
                      "picks": today_streaks
                  }, f)

              print('\n'.join(out) if out else "今日無選股-解析失敗")
          EOF
          )
          else
            PICKS="今日無選股-找不到stock_report.html"
          fi
          jq -n \
            --arg content "**tw_stocker 每日選股 ${DATE}**
          \`\`\`
          ${PICKS}
          \`\`\`
          [AI 台股量化交易 v8.5 — ${DATE}](https://ghost3070634-lab.github.io/tw_stocker/stock_report.html)" \
            '{content: $content}' | \
          curl -s -H "Content-Type: application/json" -X POST -d @- ${{ secrets.DISCORD_WEBHOOK_TRADING }}
      - name: Check if quarterly (first week of Jan/Apr/Jul/Oct)
        id: check
        run: |
          DAY=$(date -u '+%d')
          MONTH=$(date -u '+%m')
          if [ "$DAY" -le 7 ] && ([ "$MONTH" = "01" ] || [ "$MONTH" = "04" ] || [ "$MONTH" = "07" ] || [ "$MONTH" = "10" ]); then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.run == 'true'
        with:
          # Keep checkout shallow; full history is too large for hosted runners.
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-python@v6
        if: steps.check.outputs.run == 'true'
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Quick Sweep
        if: steps.check.outputs.run == 'true'
        run: python sweep.py --quick --output csv

      - name: Walk-Forward Validation
        if: steps.check.outputs.run == 'true'
        run: python walk_forward.py

      - name: Monte Carlo Stress Test (Block Bootstrap)
        if: steps.check.outputs.run == 'true'
        run: |
          LATEST_EQUITY=$(ls -t artifacts/equity_*.csv | head -1)
          python monte_carlo.py --equity "$LATEST_EQUITY" --runs 2000 --block-size 5

      - name: Upload quarterly report
        if: steps.check.outputs.run == 'true'
        run: |
          git config --global user.email "voidful.stack@gmail.com"
          git config --global user.name "Voidful"

          git add factor_search_results.csv ablation_results.csv backtest_chart.png || true
          git add -u artifacts || true

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 Quarterly health check ($(date -u '+%Y-%m-%d'))"
          fi

          # Rebase onto latest remote without downloading the full repository history.
          git fetch --no-tags --depth=50 origin ${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}
          git rebase --autostash origin/${{ github.ref_name }}

          git push origin HEAD:${{ github.ref_name }}
